{% extends "base.html" %}

{% block title %}Sign Out | Classroom Management{% endblock %}

{% block content %}
<section class="card" style="max-width: 460px; margin: 3rem auto; text-align: center;">
    <h2 style="margin-bottom: 0.7rem;">Sign out</h2>
    <p class="lead" style="font-size: 1rem; margin-bottom: 1.25rem;">
        Confirm to end your current session.
    </p>

    <form method="post" action="{{ url_for('logout') }}">
        <button type="submit" class="btn btn-danger" style="width: 100%; margin-bottom: 0.6rem;">
            Log out now
        </button>
    </form>

    <a class="btn btn-ghost" href="{{ url_for('dashboard') }}" style="width: 100%;">
        Cancel
    </a>
</section>
{% endblock %}
