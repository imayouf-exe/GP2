{% extends "base.html" %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div class="card" style="max-width: 720px; margin: 2rem auto;">
    <h1>Request blocked</h1>
    <p class="lead" style="margin-top: 1rem;">{{ message or "Your request could not be validated." }}</p>
    <div style="margin-top: 1.25rem;">
        <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
    </div>
</div>
{% endblock %}
